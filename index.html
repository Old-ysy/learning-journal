<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>今日打卡 · 习惯追踪</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 class="app-title">今日打卡</h1>
      <p class="app-date" id="today-date"></p>
    </header>

    <form class="add-form" id="add-form" autocomplete="off">
      <input
        type="text"
        id="habit-input"
        class="add-input"
        placeholder="想坚持什么？比如：跑步 30 分钟"
        maxlength="20"
        aria-label="习惯名称"
      />
      <button type="submit" class="add-btn">+ 添加</button>
    </form>

    <p class="hint" id="hint"></p>

    <ul class="habit-list" id="habit-list"></ul>

    <p class="empty-state" id="empty-state" hidden>
      还没有习惯，从第一个开始吧
    </p>

    <footer class="app-footer">
      <span>数据只存在这台浏览器里</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
